# Sitrep configuration — copy to ~/.config/sitrep/config.toml and edit.
# At least one [brief.*] section is required; everything else is optional.

# Whose briefing this is; personalizes the prompts (default: "the reader").
# name = "Alex"

# Models. Providers: glm (Ollama Cloud), openai, claude.
# summary_model = "glm"          # cheap model that summarizes each item
# models = ["openai"]            # synthesis model(s), one report each
# openai_model = "gpt-5.2"       # override a provider's model id
# claude_model = "claude-opus-5"

# Paths. archive defaults to gumshoe's own default vault; the report copy
# into a second folder happens only when inbox_copy is set.
# [paths]
# archive = "~/Vaults/Gumshoe"
# inbox_copy = "~/Vaults/Main/Inbox"

# How a Kindle EPUB is emailed (used with `sitrep run --kindle` for briefs
# that set kindle/kindle_sender); each element is formatted with {to},
# {sender}, {subject}, {file}. Default uses the gog CLI:
# kindle_send_cmd = ["gog", "gmail", "send", "--account", "{sender}",
#                    "--to", "{to}", "--subject", "{subject}",
#                    "--body", "Sent by sitrep.", "--attach", "{file}"]

# Contextualizers — personal-context sources briefs can draw on. Types:
#   journal  — a folder of dated markdown files (ambient context)
#   qmd      — local markdown note search, per-topic lookup
#   msgvault — email/meeting archive search, per-topic lookup
# Nothing is implicit: configure what you have, briefs pick by name.

# [contextualizer.journal]
# type = "journal"
# dir = "~/notes/daily"
# days = 7

# [contextualizer.notes]
# type = "qmd"
# collection = "notes"
# hits = 5

# [contextualizer.email]
# type = "msgvault"
# window = "30d"                 # newer_than filter on each topic search
# hits = 5
# mode = "hybrid"                # fts | vector | hybrid
# message_types = ["email", "meeting_transcript"]   # omit for all types

# Briefs — named reports over subsets of archive sources (gumshoe folder
# slugs; human source names also match). Explicit only: sources no brief
# claims are never reported, and runs warn about them. A source listed in
# two briefs appears in both. Per brief:
#   title           — filename/display label (default: the section name)
#   contextualizers — which to use (omitted = all configured)
#   focus           — standing angle steering topic extraction and synthesis
#   kindle / kindle_sender — EPUB delivery for this brief (with --kindle)

# [brief.work]
# title = "Work"
# sources = ["bytebytego", "hfs-research"]
# contextualizers = ["journal", "notes", "email"]
# focus = "Track what matters for enterprise AI adoption decisions."
# kindle = "you_123@kindle.com"
# kindle_sender = "your-gog-account"
